{% extends "base/base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="bg-gray-800 rounded-lg shadow-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center">
                <h2 class="text-2xl font-bold text-white">Terminal Logs</h2>
                <div id="status-indicator" class="ml-3 w-2 h-2 rounded-full bg-gray-500"></div>
            </div>
            <div class="flex items-center">
                <span id="status" class="text-gray-400 mr-4">Initializing...</span>
                <button id="pause-logs" class="bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1 rounded mr-2 transition-colors">Pause</button>
                <button id="clear-logs" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition-colors">Clear</button>
            </div>
        </div>
        <pre id="log-container" class="bg-black rounded p-4 h-[600px] overflow-y-auto font-mono text-sm text-white whitespace-pre-wrap"></pre>
    </div>
</div>

<script>
const logContainer = document.getElementById('log-container');
const clearButton = document.getElementById('clear-logs');
const pauseButton = document.getElementById('pause-logs');
const statusEl = document.getElementById('status');
const statusIndicator = document.getElementById('status-indicator');
let isPaused = false;
let lastContent = '';
let errorCount = 0;
const MAX_RETRIES = 3;
const POLL_INTERVAL = 200;

function updateStatus(message, type = 'info') {
    statusEl.textContent = message;
    const colors = {
        'info': 'bg-blue-500',
        'error': 'bg-red-500',
        'success': 'bg-green-500',
        'warning': 'bg-yellow-500'
    };
    statusIndicator.className = `ml-3 w-2 h-2 rounded-full ${colors[type]}`;
}

function updateLogs(content) {
    if (content !== lastContent) {
        logContainer.textContent = content;
        if (!isPaused) {
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        lastContent = content;
        updateStatus('Updated: ' + new Date().toLocaleTimeString(), 'success');
        errorCount = 0;
    }
}

clearButton.addEventListener('click', () => {
    logContainer.textContent = '';
    lastContent = '';
    updateStatus('Logs cleared', 'info');
});

pauseButton.addEventListener('click', () => {
    isPaused = !isPaused;
    pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
    pauseButton.className = isPaused ? 
        'bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded mr-2 transition-colors' : 
        'bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1 rounded mr-2 transition-colors';
    updateStatus(isPaused ? 'Paused' : 'Watching logs...', isPaused ? 'warning' : 'success');
});

async function pollLogs() {
    if (!isPaused) {
        try {
            const response = await fetch('/terminal_logs/data/');
            if (!response.ok) throw new Error('Server error');
            const text = await response.text();
            if (text.trim()) {
                updateLogs(text);
            }
        } catch (error) {
            console.error('Error fetching logs:', error);
            errorCount++;
            if (errorCount > MAX_RETRIES) {
                updateStatus('Connection lost. Retrying...', 'error');
            }
        }
    }
    setTimeout(pollLogs, POLL_INTERVAL);
}

// Start polling
updateStatus('Watching logs...', 'success');
pollLogs();
</script>
{% endblock %}
