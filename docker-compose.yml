version: '3.8'

services:
  redis:
    image: redis:7.0-alpine
    container_name: k_redis
    restart: unless-stopped
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --port 6380 
      --appendonly yes
      --save 900 1 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --tcp-backlog 511
      --io-threads 4
    networks:
      - konquest_network
    deploy:
      resources:
        limits:
          memory: 4.5G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  django:
    build: .
    container_name: konquest_django
    restart: unless-stopped
    command: >
      bash -c "
        echo 'Waiting for Redis...' &&
        while ! nc -z redis 6380; do sleep 1; done &&
        echo 'Redis is up!' &&
        mkdir -p /app/logs &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn konquist.wsgi:application --bind=0.0.0.0:8001 --workers=4 --threads=4 --timeout=600 --keep-alive=65 --max-requests=2000 --max-requests-jitter=200 --worker-tmp-dir=/dev/shm --worker-class=gthread --log-level=debug --access-logfile=/app/logs/gunicorn-access.log --error-logfile=/app/logs/gunicorn-error.log --capture-output --enable-stdio-inheritance"
    volumes:
      - .:/app:delegated
      - static_volume:/app/staticfiles
      - media_volume:/app/core/media
      - /dev/shm:/dev/shm
      - logs_volume:/app/logs
      - ${PWD}/apiSocialHub/logs:/app/apiSocialHub/logs:rw
    tmpfs:
      - /tmp
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=konquist.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,konquest_django
      - DEBUG=True
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - konquest_network
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  celery_worker:
    build: .
    container_name: k_celery_worker
    restart: unless-stopped
    command: >
      bash -c "
        echo 'Waiting for Redis...' &&
        while ! nc -z redis 6380; do sleep 1; done &&
        echo 'Redis is up!' &&
        mkdir -p /app/logs &&
        celery -A konquist worker -l INFO
        --loglevel=DEBUG 
        --concurrency=4 
        -Q default,campaign_queue 
        --max-tasks-per-child=500 
        --max-memory-per-child=512000
        --logfile=/app/logs/celery.log"
    volumes:
      - .:/app:delegated
      - media_volume:/app/core/media
      - /dev/shm:/dev/shm
      - logs_volume:/app/logs
    tmpfs:
      - /tmp
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=konquist.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    networks:
      - konquest_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  celery_beat:
    build: .
    container_name: k_celery_beat
    restart: unless-stopped
    user: root
    command: >
      bash -c "
        echo 'Waiting for Redis...' &&
        while ! nc -z redis 6380; do sleep 1; done &&
        echo 'Redis is up!' &&
        mkdir -p /app/logs &&
        mkdir -p /app/celerybeat &&
        chown -R root:root /app/celerybeat &&
        chmod -R 777 /app/celerybeat &&
        rm -f /app/celerybeat/celerybeat.pid &&
        cd /app &&
        celery -A konquist beat -l INFO --loglevel=DEBUG --logfile=/app/logs/celerybeat.log --schedule=/app/celerybeat/celerybeat-schedule"
    volumes:
      - .:/app:delegated
      - logs_volume:/app/logs
      - celerybeat_volume:/app/celerybeat
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=konquist.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - konquest_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: k_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:k_redis:6380:0:${REDIS_PASSWORD}
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - konquest_network
  

  certbot:
    image: certbot/certbot:latest
    container_name: k_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - ./docker/nginx/html:/var/www/html
    command: >
      certonly --webroot 
      --webroot-path=/var/www/html 
      --email luis@konquista.com.br 
      --agree-tos 
      --no-eff-email 
      -d konquista.com.br 
      -d www.konquista.com.br 
      --non-interactive
    networks:
      - konquest_network

  nginx:
    image: nginx:1.25-alpine
    container_name: k_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/konquest.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/core/media
      - certbot_conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    networks:
      - konquest_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  konquest_network:
    name: konquest_network_new

volumes:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/logs
  celerybeat_volume:
  nginx_logs:
  certbot_www:
  certbot_conf: